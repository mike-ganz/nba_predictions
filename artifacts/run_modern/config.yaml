calibration:
  apply_isotonic: true
  apply_temperature: true
  market_weight: 0.5
data:
  availability_baselines: data/player_baselines.csv
  test_jsonl: data/games_test.jsonl
  training_jsonl: data/games_train.jsonl
  validation_jsonl: data/games_val.jsonl
evaluation:
  margin_high: 60
  margin_low: -60
  max_score: 150
  reports_dir: reports
model:
  alpha_away: 0.5
  alpha_home: 0.5
  alpha_shared: 0.5
  enable_overdispersion: false
  l1_ratio_away: 0.1
  l1_ratio_home: 0.1
  l1_ratio_shared: 0.0
  overdispersion_alpha: 0.1
  overdispersion_l1_ratio: 0.0
training:
  random_state: 42
  test_size: 0.2
