calibration:
  apply_isotonic: true
  apply_temperature: true
  market_weight: 0.5
data:
  availability_baselines: data/player_baselines.csv
  test_jsonl: data/games_test.jsonl
  training_jsonl: data/games_train.jsonl
  validation_jsonl: data/games_val.jsonl
evaluation:
  margin_high: 60
  margin_low: -60
  max_score: 150
  reports_dir: reports
model:
  alpha_away: 0.5
  alpha_home: 0.5
  alpha_shared: 2.0
  alphas_away:
  - 0.1
  - 0.3
  - 0.5
  - 1.0
  - 2.0
  alphas_home:
  - 0.1
  - 0.3
  - 0.5
  - 1.0
  - 2.0
  alphas_shared:
  - 1.0
  - 2.0
  - 3.0
  - 5.0
  cv_folds: 5
  enable_overdispersion: true
  overdispersion_alpha: 0.5
  use_cv: true
training:
  random_state: 42
  test_size: 0.2
