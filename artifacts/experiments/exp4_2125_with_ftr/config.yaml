data:
  prediction_jsonl: data/games_2025_2026_current_norm.jsonl
  training_jsonl: data/games_train_2021_2025_combined_norm.jsonl
  validation_jsonl: data/games_val_with_players_norm.jsonl
evaluation:
  margin_high: 60
  margin_low: -60
metadata:
  description: Full experiment - 2021-2025 training + FTR features
  experiment_id: exp4_2125_with_ftr
  n_features: 16
  note: Tests if FTR + 2024-25 data helps with current regime
  training_seasons:
  - 2021-2022
  - 2022-2023
  - 2023-2024
  - 2024-2025
model:
  colsample_bytree: 1.0
  early_stopping_rounds: null
  eval_metric: rmse
  exclude_features:
  - away_tov_edge
  - shared_team_weighted_ts_away
  - away_usage_share_top2
  - shared_implied_home_winprob
  - away_orb_edge
  - away_tpar
  - shared_pace_mean
  - shared_pace_diff
  - home_b2b
  - away_b2b
  - home_three_in_four
  - away_three_in_four
  include_diff_features: false
  include_fav_underdog_features: false
  learning_rate: 0.01
  max_depth: 3
  model_type: xgboost
  n_estimators: 100
  n_jobs: -1
  random_state: 42
  reg_alpha: 1.0
  reg_lambda: 2.0
  subsample: 0.6
