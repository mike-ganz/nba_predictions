data:
  training_jsonl: data\experiments\context\games_train_context.jsonl
model:
  colsample_bytree: 0.8
  exclude_features:
  - home_b2b
  - home_three_in_four
  - away_b2b
  - away_three_in_four
  include_context: true
  include_diff_features: false
  learning_rate: 0.02
  max_depth: 4
  model_type: xgboost
  n_estimators: 500
  reg_alpha: 0.1
  reg_lambda: 1.0
  subsample: 0.8
