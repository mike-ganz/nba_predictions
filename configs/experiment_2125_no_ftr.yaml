# Experiment 2: 14 Champion Metrics, Seasons 2021-2025
# Training data: 2021-2022, 2022-2023, 2023-2024, 2024-2025
# Excludes FTR (same as current champion)

data:
  training_jsonl: data/games_train_2021_2025_combined_norm.jsonl
  validation_jsonl: data/games_val_with_players_norm.jsonl
  prediction_jsonl: data/games_2025_2026_current_norm.jsonl

model:
  model_type: xgboost
  
  # Use same hyperparameters as current champion
  n_estimators: 100
  max_depth: 3
  learning_rate: 0.01
  subsample: 0.6
  colsample_bytree: 1.0
  reg_alpha: 1.0
  reg_lambda: 2.0
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: null
  eval_metric: rmse
  
  # Same exclusions as champion (14 features total: 12 core + 2 rest_days)
  # Excludes FTR
  exclude_features:
  - away_tov_edge
  - shared_team_weighted_ts_away
  - away_usage_share_top2
  - shared_implied_home_winprob
  - away_orb_edge
  - away_tpar
  - shared_pace_mean
  - shared_pace_diff
  - home_ftr
  - away_ftr
  - home_b2b
  - away_b2b
  - home_three_in_four
  - away_three_in_four
  
  include_diff_features: false
  include_fav_underdog_features: false

evaluation:
  margin_low: -60
  margin_high: 60

metadata:
  experiment_id: exp2_2125_no_ftr
  description: "Add 2024-2025 season - FTR still excluded"
  training_seasons: ["2021-2022", "2022-2023", "2023-2024", "2024-2025"]
  n_features: 14

