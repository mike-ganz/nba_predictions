# Configuration for Direct Margin Prediction Model

data:
  training_jsonl: data/games_train_with_players_90.jsonl
  validation_jsonl: data/games_val_with_players.jsonl
  prediction_jsonl: data/games_predict_2024_2025_with_players.jsonl

model:
  # Use cross-validation to automatically tune regularization
  use_cv: true
  
  # Alpha ranges for CV (wider range for mean, stronger for variance)
  alphas_mean: [0.05, 0.1, 0.3, 0.5, 1.0, 2.0, 3.0, 5.0, 10.0]
  alphas_variance: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
  
  cv_folds: 5
  
  # Fallback alphas if use_cv=false
  alpha_mean: 0.5
  alpha_variance: 2.0
  
  # Minimum predicted variance (prevents overconfidence)
  min_variance: 1.0
  
  # Features to exclude (identified as harmful via permutation importance)
  # Format: 'home_FEATURE', 'away_FEATURE', 'shared_FEATURE', or 'diff_FEATURE'
  exclude_features:
    - shared_team_weighted_ts_away
    - away_usage_share_top2
    - shared_implied_home_winprob

evaluation:
  # Range for margin PMF (if needed for compatibility)
  margin_low: -60
  margin_high: 60

