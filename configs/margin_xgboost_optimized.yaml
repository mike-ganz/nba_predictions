data:
  prediction_jsonl: data/games_predict_2024_2025_with_players_norm.jsonl
  training_jsonl: data/games_train_with_players_90_norm.jsonl
  validation_jsonl: data/games_val_with_players_norm.jsonl
evaluation:
  margin_high: 60
  margin_low: -60
model:
  colsample_bytree: 0.7
  early_stopping_rounds: null
  eval_metric: rmse
  exclude_features:
  # Original exclusions from tuned model
  - shared_team_weighted_ts_away
  - away_usage_share_top2
  - shared_implied_home_winprob
  # New exclusions from feature selection (6 harmful features)
  - home_ftr
  - home_rest_days
  - away_orb_edge
  - away_tpar
  - away_rest_days
  - shared_pace_mean
  - shared_pace_diff
  include_diff_features: false
  learning_rate: 0.01
  max_depth: 2
  model_type: xgboost
  n_estimators: 100
  n_jobs: -1
  random_state: 42
  reg_alpha: 0.1
  reg_lambda: 10.0
  subsample: 0.6
tuning:
  note: "Feature-optimized configuration based on systematic feature selection"
  cv_folds: 5
  method: feature_selection

