data:
  training_jsonl: data/games_train_with_players_90_norm.jsonl
  validation_jsonl: data/games_val_with_players_norm.jsonl
  prediction_jsonl: data/games_predict_2024_2025_with_players_norm.jsonl
model:
  model_type: xgboost
  # Use the tuned hyperparameters from the rest-only Champion variant
  n_estimators: 100
  max_depth: 3
  learning_rate: 0.01
  subsample: 0.6
  colsample_bytree: 1.0
  reg_alpha: 1.0
  reg_lambda: 2.0
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: null
  eval_metric: rmse

  # Feature exclusions: identical to rest-only Champion
  # (rest_days included; no FTR; no redundant away_* edges)
  exclude_features:
  - away_tov_edge
  - shared_team_weighted_ts_away
  - away_usage_share_top2
  - shared_implied_home_winprob
  - away_orb_edge
  - away_tpar
  - shared_pace_mean
  - shared_pace_diff
  - home_ftr
  - away_ftr

  include_diff_features: false
  include_fav_underdog_features: false

  # NEW: sample weighting around the spread in training
  use_spread_weighting: true
  spread_weight_sigma: 6.0

evaluation:
  margin_low: -60
  margin_high: 60

tuning:
  method: model_specific_random_search
  cv_folds: 5
  n_iterations: 100
  best_cv_rmse: 13.2333
  n_features: 14
  note: Rest-aware Champion with spread-based sample weighting (2021-2024)


