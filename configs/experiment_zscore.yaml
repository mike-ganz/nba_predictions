  include_diff_features: false
  include_fav_underdog_features: false
  learning_rate: 0.01
  max_depth: 3
  model_type: xgboost
  n_estimators: 100
  n_jobs: -1
  random_state: 42
  reg_alpha: 1.0
  reg_lambda: 2.0
