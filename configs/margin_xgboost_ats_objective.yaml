# Configuration for XGBoost with Custom ATS-Focused Objective Function

data:
  training_jsonl: data/games_train_with_players_90_norm.jsonl
  validation_jsonl: data/games_val_with_players_norm.jsonl
  prediction_jsonl: data/games_predict_2024_2025_with_players_norm.jsonl

model:
  # Model type identifier
  model_type: xgboost
  
  # XGBoost hyperparameters (same as standard for fair comparison)
  n_estimators: 100
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1  # L1 regularization
  reg_lambda: 1.0  # L2 regularization
  
  # Training parameters
  random_state: 42
  n_jobs: -1  # Use all CPU cores
  
  # Early stopping (optional - set to null to disable)
  early_stopping_rounds: null
  eval_metric: rmse
  
  # Custom ATS-Focused Objective
  use_ats_objective: true
  ats_penalty_weight: 10.0  # Heavy penalty for getting ATS wrong
  margin_penalty_weight: 0.1  # Light penalty for margin error
  
  # Feature engineering
  include_diff_features: false  # XGBoost learns interactions automatically
  
  # Feature exclusions (same as standard for fair comparison)
  exclude_features:
    - shared_team_weighted_ts_away
    - away_usage_share_top2
    - shared_implied_home_winprob
    - shared_pace_diff

evaluation:
  # Range for margin analysis (if needed for compatibility)
  margin_low: -60
  margin_high: 60

